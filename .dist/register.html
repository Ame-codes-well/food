<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join PeoplePilot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-side">
      <a class="brand" href="index.html"><span class="brand-mark">P</span> PeoplePilot</a>
      <div>
        <h1>Your people are your <span>power.</span></h1>
        <p>Start with a workspace that keeps your team aligned, visible, and ready for what is next.</p>
      </div>
      <a class="back-link" href="index.html">← Back to home</a>
    </section>

    <section class="auth-main">
      <form class="form-card" action="index.html" method="get">
        <h2>Create your workspace</h2>
        <p>Set up your account and bring your team into focus.</p>
        <div class="form-row">
          <div class="field"><label for="first-name">First name</label><input id="first-name" name="first-name" type="text" placeholder="Alex" required></div>
          <div class="field"><label for="last-name">Last name</label><input id="last-name" name="last-name" type="text" placeholder="Morgan" required></div>
        </div>
        <div class="field"><label for="email">Work email</label><input id="email" name="email" type="email" placeholder="you@company.com" required></div>
        <div class="field"><label for="role">Your role</label><select id="role" name="role" required><option value="">Choose a role</option><option>People manager</option><option>HR leader</option><option>Team member</option><option>Founder</option></select></div>
        <div class="field"><label for="password">Create password</label><input id="password" name="password" type="password" placeholder="At least 8 characters" minlength="8" required></div>
        <button class="button button-coral button-full" type="submit">Create workspace&nbsp; →</button>
        <p class="form-note">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </section>
  </main>
</body>
</html>
