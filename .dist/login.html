<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | PeoplePilot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-side">
      <a class="brand" href="index.html"><span class="brand-mark">P</span> PeoplePilot</a>
      <div>
        <h1>Welcome back to your <span>people.</span></h1>
        <p>Your team's rhythm is waiting. Sign in to pick up exactly where you left off.</p>
      </div>
      <a class="back-link" href="index.html">← Back to home</a>
    </section>

    <section class="auth-main">
      <form class="form-card" action="index.html" method="get">
        <h2>Good to see you.</h2>
        <p>Enter your details to open your workspace.</p>
        <div class="field"><label for="email">Work email</label><input id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required></div>
        <button class="button button-dark button-full" type="submit">Log in&nbsp; →</button>
        <p class="form-note">New to PeoplePilot? <a href="register.html">Create an account</a></p>
      </form>
    </section>
  </main>
</body>
</html>
