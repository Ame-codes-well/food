<!DOCTYPE html>
<html>
<head>
	<title>HTML Registration Form</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background:
				linear-gradient(rgba(8, 25, 45, 0.52), rgba(8, 25, 45, 0.52)),
				url('https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
			font-family: Arial, sans-serif;
		}

		.form-card {
			width: 100%;
			max-width: 750px;
			background: rgba(255, 255, 255, 0.94);
			border: 1px solid rgba(160, 180, 210, 0.6);
			border-radius: 22px;
			box-shadow: 0 22px 50px rgba(7, 26, 49, 0.24);
			padding: 30px 28px;
			backdrop-filter: blur(2px);
		}

		h1 {
			text-align: center;
			margin-top: 0;
			margin-bottom: 24px;
			color: #1d3d63;
			font-size: 2rem;
		}

		form {
			display: grid;
			gap: 16px;
		}

		.row {
			display: grid;
			grid-template-columns: 180px 1fr;
			align-items: center;
			gap: 12px;
		}

		label {
			font-weight: 600;
			color: #23405d;
		}

		input, select, button {
			font: inherit;
		}

		input[type="text"],
		input[type="password"],
		input[type="date"],
		select,
		input[type="file"] {
			width: 100%;
			padding: 10px 12px;
			border-radius: 10px;
			border: 1px solid #b9cfe1;
			background: #f9fbff;
		}

		.radio-group,
		.checkbox-group {
			display: flex;
			flex-wrap: wrap;
			gap: 12px 18px;
			padding-top: 2px;
		}

		.radio-group label,
		.checkbox-group label {
			font-weight: 500;
			color: #2f4f68;
		}

		button {
			margin: 10px auto 0;
			padding: 12px 26px;
			border: none;
			border-radius: 10px;
			background: linear-gradient(135deg, #2e7dc2, #1d5ca8);
			color: white;
			font-weight: bold;
			cursor: pointer;
			box-shadow: 0 8px 18px rgba(30, 92, 168, 0.25);
		}

		button:hover {
			background: linear-gradient(135deg, #2569aa, #1b4d8d);
		}

		@media (max-width: 600px) {
			.form-card {
				padding: 22px 18px;
			}

			.row {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<div class="form-card">
		<h1>Registration Form</h1>

		<form>
			<div class="row">
				<label for="username">Username:</label>
				<input type="text" id="username" name="username">
			</div>

			<div class="row">
				<label for="password">Password:</label>
				<input type="password" id="password" name="password">
			</div>

			<div class="row">
				<label for="dob">Date of Birth:</label>
				<input type="date" id="dob" name="dob">
			</div>

			<div class="row">
				<label for="qualification">Qualification:</label>
				<select id="qualification" name="qualification">
					<option value="high-school">High School</option>
					<option value="bachelor">Bachelor's Degree</option>
					<option value="master">Master's Degree</option>
					<option value="phd">PhD</option>
					<option value="trvcel">Trvcel</option>
				</select>
			</div>

			<div class="row">
				<label>Gender:</label>
				<div class="radio-group">
					<input type="radio" id="male" name="gender" value="male">
					<label for="male">Male</label>

					<input type="radio" id="female" name="gender" value="female">
					<label for="female">Female</label>

					<input type="radio" id="non-binary" name="gender" value="non-binary">
					<label for="non-binary">Non-binary</label>

					<input type="radio" id="transgender" name="gender" value="transgender">
					<label for="transgender">Transgender</label>

					<input type="radio" id="prefer-not-to-say" name="gender" value="prefer-not-to-say">
					<label for="prefer-not-to-say">Prefer not to say</label>
				</div>
			</div>

			<div class="row">
				<label>Subjects:</label>
				<div class="checkbox-group">
					<input type="checkbox" id="math" name="subjects" value="math">
					<label for="math">Math</label>

					<input type="checkbox" id="science" name="subjects" value="science">
					<label for="science">Science</label>

					<input type="checkbox" id="history" name="subjects" value="history">
					<label for="history">History</label>

					<input type="checkbox" id="computer" name="subjects" value="computer">
					<label for="computer">Computer</label>
				</div>
			</div>

			<div class="row">
				<label for="resume">Upload Resume:</label>
				<input type="file" id="resume" name="resume">
			</div>

			<button type="submit">Register</button>
		</form>
	</div>
</body>
</html>
