<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Simple Text Box</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			display: grid;
			place-items: center;
			min-height: 100vh;
			margin: 0;
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #dbeafe, #fce7f3);
		}

		.card {
			width: min(90%, 400px);
			padding: 32px;
			text-align: center;
			background: white;
			border-radius: 16px;
			box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
		}

		h1 {
			margin-top: 0;
			color: #1e293b;
		}

		input, button {
			width: 100%;
			padding: 12px;
			margin-top: 10px;
			border-radius: 8px;
			font-size: 16px;
		}

		input {
			border: 1px solid #cbd5e1;
		}

		button {
			color: white;
			background: #2563eb;
			border: none;
			cursor: pointer;
		}

		button:hover {
			background: #1d4ed8;
		}
	</style>
</head>
<body>
	<div class="card">
		<h1>Enter Your Name</h1>
		<input id="textInput" type="text" placeholder="Enter name">
		<button type="button" onclick="showText()">Submit</button>
	</div>

	<script>
		function showText() {
			const name = document.getElementById("textInput").value.trim();

			if (name.length === 0) {
				alert("name must be required");
			} else if (name.length <= 2) {
				alert("name must be minimum three characters");
			} else if (name.length > 10) {
				alert("name cannot exceed more than 15 character");
			} else {
				alert(name);
			}
		}
	</script>
</body>
</html>
