<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4 p-md-5">
          <p class="text-danger fw-semibold">CONTACT US</p>
          <h1 class="fw-bold">We would love to hear from you.</h1>
          <p class="text-secondary">Send us a message and our team will get back to you soon.</p>
          <form>
            <div class="mb-3">
              <label for="contactName" class="form-label">Name</label>
              <input id="contactName" class="form-control" type="text" placeholder="Your name">
            </div>
            <div class="mb-3">
              <label for="contactEmail" class="form-label">Email</label>
              <input id="contactEmail" class="form-control" type="email" placeholder="you@example.com">
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea id="message" class="form-control" rows="4" placeholder="How can we help?"></textarea>
            </div>
            <button class="btn btn-danger" type="submit">Send message</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
