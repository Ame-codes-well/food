<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
	:host {
		display: block;
		min-height: 100vh;
		background: #fffaf7;
		color: #241d1a;
	}

	.brand-mark {
		color: #e23744;
		letter-spacing: -1px;
	}
</style>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
	<div class="container py-2">
		<a class="navbar-brand fw-bold fs-3 brand-mark" href="#">zomato</a>
		<button class="navbar-toggler" type="button" (click)="toggleMenu()" aria-controls="mainNavigation" [attr.aria-expanded]="menuOpen" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" [class.show]="menuOpen" id="mainNavigation">
			<ul class="navbar-nav ms-auto gap-lg-3">
				<li class="nav-item"><a class="nav-link" routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Home</a></li>
				<li class="nav-item"><a class="nav-link" routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a></li>
				<li class="nav-item"><a class="nav-link" routerLink="/services" routerLinkActive="active" (click)="closeMenu()">Services</a></li>
				<li class="nav-item"><a class="nav-link" routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a></li>
				<li class="nav-item"><a class="nav-link" routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Log in</a></li>
				<li class="nav-item"><a class="btn btn-danger rounded-pill px-4" routerLink="/signup" routerLinkActive="active" (click)="closeMenu()">Sign up</a></li>
			</ul>
		</div>
	</div>
</nav>

<router-outlet></router-outlet>

<footer id="footer" class="bg-dark text-white py-4">
	<div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
		<span class="fw-bold">zomato</span>
		<small class="text-white-50">Made for hungry moments.</small>
	</div>
</footer>
